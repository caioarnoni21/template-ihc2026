<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="790" viewBox="0 0 1640 790"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect x="0" y="0" width="1640" height="790" fill="#ffffff"/>
<text x="820" y="34" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#111" text-anchor="middle">GOMS — T03 Esclarecer uma interpretação sobre o próprio trabalho e verificar a resposta</text>
<text x="820" y="58" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Persona P03 — Maria Fonseca · Autora: Tainá Cunha Bueno — 22.119.025-9</text>
<rect x="420" y="78" width="800" height="56" rx="6" fill="#e8f1ec" stroke="#1f5c3f" stroke-width="1.5"/>
<text x="820.0" y="110.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">G0 — Esclarecer uma interpretação sobre o próprio trabalho e verificar se houve resposta</text>
<line x1="820" y1="134" x2="820" y2="155" stroke="#333" stroke-width="1.5"/>
<line x1="215" y1="155" x2="1430" y2="155" stroke="#333" stroke-width="1.5"/>
<line x1="215.0" y1="155" x2="215.0" y2="170" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="170" width="390" height="52" rx="6" fill="#e8f1ec" stroke="#1f5c3f" stroke-width="1.5"/>
<text x="215.0" y="200.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">G1 — Abrir a explicação compartilhada</text>
<rect x="20" y="236" width="390" height="116" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="32" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M1 — Pelo aviso recebido</text>
<text x="36" y="284" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Ler o aviso de explicação compartilhada</text>
<text x="36" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Ver explicação”</text>
<text x="36" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Conferir nome e período exibidos</text>
<rect x="20" y="364" width="390" height="116" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="32" y="386" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M2 — Pelo menu</text>
<text x="36" y="412" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Minha análise” no menu</text>
<text x="36" y="436" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar o ciclo</text>
<text x="36" y="460" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Conferir nome e período exibidos</text>
<rect x="20" y="492" width="390" height="70" rx="6" fill="#fff8e1" stroke="#b8962e" stroke-width="1.5"/>
<text x="32" y="518" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">SR1: se o aviso está visível → M1;</text>
<text x="32" y="540" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">senão → M2.</text>
<line x1="620.0" y1="155" x2="620.0" y2="170" stroke="#333" stroke-width="1.5"/>
<rect x="425" y="170" width="390" height="52" rx="6" fill="#e8f1ec" stroke="#1f5c3f" stroke-width="1.5"/>
<text x="620.0" y="190.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">G2 — Compreender a finalidade e o que</text>
<text x="620.0" y="210.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">mudou</text>
<rect x="425" y="236" width="390" height="140" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="437" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">Operadores (sem métodos alternativos)</text>
<text x="441" y="284" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• [Opcional] Ler finalidade, fontes e quem acessa</text>
<text x="441" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Ler a dimensão comunicação</text>
<text x="441" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Ler a dimensão tarefas</text>
<text x="441" y="356" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Ler “o que significa e o que não significa”</text>
<rect x="425" y="388" width="390" height="70" rx="6" fill="#fff8e1" stroke="#b8962e" stroke-width="1.5"/>
<text x="437" y="414" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">Não há regra de seleção: a sequência é única.</text>
<text x="437" y="436" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">1ª consulta: ler finalidade antes da explicação.</text>
<line x1="1025.0" y1="155" x2="1025.0" y2="170" stroke="#333" stroke-width="1.5"/>
<rect x="830" y="170" width="390" height="52" rx="6" fill="#e8f1ec" stroke="#1f5c3f" stroke-width="1.5"/>
<text x="1025.0" y="200.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">G3 — Apresentar o contexto</text>
<rect x="830" y="236" width="390" height="164" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="842" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M3 — Mensagem escrita</text>
<text x="846" y="284" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Esclarecer ou adicionar contexto”</text>
<text x="846" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Escolher tipo: pergunta, correção ou contexto</text>
<text x="846" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Digitar a mensagem</text>
<text x="846" y="356" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Conferir o destinatário</text>
<text x="846" y="380" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Enviar”</text>
<rect x="830" y="412" width="390" height="140" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="842" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M4 — Conversa reservada</text>
<text x="846" y="460" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Prefiro conversar”</text>
<text x="846" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• [Opcional] Indicar preferência de horário</text>
<text x="846" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Conferir o destinatário</text>
<text x="846" y="532" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Enviar pedido”</text>
<rect x="830" y="564" width="390" height="70" rx="6" fill="#fff8e1" stroke="#b8962e" stroke-width="1.5"/>
<text x="842" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">SR2: se quer deixar registro ou corrigir um fato → M3;</text>
<text x="842" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">se o assunto é pessoal ou prefere falar → M4.</text>
<line x1="1430.0" y1="155" x2="1430.0" y2="170" stroke="#333" stroke-width="1.5"/>
<rect x="1235" y="170" width="390" height="52" rx="6" fill="#e8f1ec" stroke="#1f5c3f" stroke-width="1.5"/>
<text x="1430.0" y="200.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111" text-anchor="middle">G4 — Acompanhar e concluir</text>
<rect x="1235" y="236" width="390" height="116" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="1247" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">Operadores comuns</text>
<text x="1251" y="284" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Conferir confirmação, data e destinatário</text>
<text x="1251" y="308" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Abrir “Minhas solicitações”</text>
<text x="1251" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Ler o estado e a resposta</text>
<rect x="1235" y="364" width="390" height="68" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="1247" y="386" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M5 — Considerar esclarecido</text>
<text x="1251" y="412" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Considero esclarecido”</text>
<rect x="1235" y="444" width="390" height="116" rx="6" fill="#eaf2fb" stroke="#3a6ea5" stroke-width="1.5"/>
<text x="1247" y="466" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#1d3f66" text-anchor="start">M6 — Pedir nova revisão</text>
<text x="1251" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Pedir nova revisão”</text>
<text x="1251" y="516" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Digitar complemento</text>
<text x="1251" y="540" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#111" text-anchor="start">• Selecionar “Enviar”</text>
<rect x="1235" y="572" width="390" height="70" rx="6" fill="#fff8e1" stroke="#b8962e" stroke-width="1.5"/>
<text x="1247" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">SR3: se a resposta considera o contexto → M5;</text>
<text x="1247" y="620" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5c4a12" text-anchor="start">senão → M6 (volta a G3).</text>
<rect x="20" y="666" width="1600" height="96" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
<text x="40" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#333" text-anchor="start">Legenda: verde = Goals (metas); azul = Methods (sequências alternativas) com Operators (ações elementares, •); amarelo = Selection Rules.</text>
<text x="40" y="716" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#333" text-anchor="start">G1 → G2 → G3 → G4 em sequência. Se M6 for usado, a tarefa retorna a G3 com a solicitação anterior vinculada.</text>
<text x="40" y="740" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#333" text-anchor="start">Operadores descrevem ações de interface propostas no protótipo (F14–F18); os rótulos entre aspas são provisórios e serão conferidos na avaliação.</text></svg>