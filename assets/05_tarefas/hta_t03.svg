<text x="80" y="738" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#333" text-anchor="start">Leitura: caixas verdes = subobjetivos; caixas brancas = operações terminais neste nível; caixas amarelas = planos (ordem, condição, repetição).</text>
<text x="80" y="760" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#333" text-anchor="start">Fora da tarefa: a conversa pessoal com o gestor e a eventual revisão da análise pelo sistema. Proto-persona: comportamentos são hipóteses a validar (H06, H11, H25, H28).</text></svg>