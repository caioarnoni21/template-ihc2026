<text x="56" y="1464" font-family="Inter, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">● abertura · ◉ encerramento · ■ processamento do sistema · cenas com tópico no cabeçalho e diálogos no corpo (u: usuária, d: preposto do designer, d+u: diálogo) · linhas tracejadas = retorno/recuperação.</text>
<text x="56" y="1484" font-family="Inter, DejaVu Sans, sans-serif" font-size="12.5" font-weight="400" fill="#333" text-anchor="start">[PP] prevenção passiva · [RA] recuperação apoiada · [AL] alerta. O sistema não decide sobre a resposta do gestor; C7 apenas comunica o estado e o conteúdo da resposta.</text></svg>